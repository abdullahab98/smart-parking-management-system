<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Smart Parking System</title>
  <meta name="description" content="Centralized administration console for system analytics, users, parking facilities, and revenue oversight.">
  <meta name="theme-color" content="#A8532E">

  <!-- Google Fonts: Fraunces & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/manager.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <!-- Scripts -->
  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/admin-shell.js"></script>

  <script>
    async function initAdminDashboard() {
      try {
        const appContent = renderAdminShell('dashboard');
        if (!appContent) return;

        // 1. Header
        const header = document.createElement('header');
        header.className = 'app-page-header';

        const titleWrap = document.createElement('div');
        const eyebrow = document.createElement('p');
        eyebrow.className = 'app-page-eyebrow';
        eyebrow.textContent = 'Platform Operations';

        const title = document.createElement('h1');
        title.className = 'app-page-title';
        title.textContent = 'Executive Dashboard';

        const desc = document.createElement('p');
        desc.className = 'app-page-desc';
        desc.textContent = 'Comprehensive system oversight of revenue collections, user accounts, bay capacity, and live reservations.';

        titleWrap.appendChild(eyebrow);
        titleWrap.appendChild(title);
        titleWrap.appendChild(desc);
        header.appendChild(titleWrap);
        appContent.appendChild(header);

        // Mount Container
        const container = document.createElement('div');
        container.id = 'admin-dashboard-container';
        appContent.appendChild(container);

        if (typeof loadingSkeleton === 'function') {
          container.appendChild(loadingSkeleton(4, 'card'));
        }

        async function loadDashboard() {
          container.innerHTML = '';

          try {
            const res = await apiRequest('/admin/dashboard');
            const data = res.data || {};
            const stats = data.stats || {};
            const recent = data.recentBookings || [];

            // 2. Metrics Statistics Grid
            const statGrid = document.createElement('section');
            statGrid.className = 'stat-grid';
            statGrid.setAttribute('aria-label', 'Key Performance Indicators');

            // Total Revenue
            statGrid.appendChild(createStatCard('Total Revenue', `৳${stats.totalRevenue || 0}`, 'Settled customer payments'));

            // Total Bookings
            statGrid.appendChild(createStatCard('Total Bookings', stats.totalBookings || 0, `${stats.activeBookings || 0} currently active`));

            // System Occupancy
            statGrid.appendChild(createStatCard('Bay Occupancy', `${stats.occupancyRate || 0}%`, `${stats.occupiedSlots || 0} of ${stats.totalSlots || 0} occupied`));

            // Registered Users
            statGrid.appendChild(createStatCard('Total Users', stats.totalUsers || 0, `${stats.totalCustomers || 0} customers, ${stats.totalManagers || 0} managers`));

            // Facilities Count
            statGrid.appendChild(createStatCard('Active Facilities', stats.totalLocations || 0, 'Commercial parking facilities'));

            // Available Slots
            statGrid.appendChild(createStatCard('Available Slots', stats.availableSlots || 0, 'Open parking bays across city'));

            container.appendChild(statGrid);

            // 3. Quick Action Shortcuts Section
            const actionSection = document.createElement('section');
            actionSection.style.marginBlock = 'var(--space-6)';

            const actionHeading = document.createElement('h2');
            actionHeading.className = 'section-title';
            actionHeading.style.fontSize = 'var(--text-lg)';
            actionHeading.style.marginBottom = 'var(--space-3)';
            actionHeading.textContent = 'Administrative Actions';
            actionSection.appendChild(actionHeading);

            const actionGrid = document.createElement('div');
            actionGrid.style.display = 'grid';
            actionGrid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(200px, 1fr))';
            actionGrid.style.gap = 'var(--space-3)';

            const actions = [
              { label: 'Manage Users & Roles', href: 'users.html', desc: 'Promote managers, block accounts' },
              { label: 'Facilities & Slots', href: 'facilities.html', desc: 'Add locations, configure bays' },
              { label: 'Financial Ledger', href: 'payments.html', desc: 'Audit payments and transactions' },
              { label: 'Pricing Configuration', href: 'pricing.html', desc: 'Update hourly & daily rates' }
            ];

            actions.forEach(act => {
              const card = document.createElement('a');
              card.href = act.href;
              card.style.display = 'block';
              card.style.padding = 'var(--space-4)';
              card.style.background = '#FFFFFF';
              card.style.border = '1px solid var(--color-border)';
              card.style.textDecoration = 'none';
              card.style.color = 'inherit';

              const cardTitle = document.createElement('strong');
              cardTitle.style.display = 'block';
              cardTitle.style.color = 'var(--color-ink)';
              cardTitle.style.fontSize = 'var(--text-sm)';
              cardTitle.textContent = act.label;

              const cardDesc = document.createElement('span');
              cardDesc.style.display = 'block';
              cardDesc.style.fontSize = 'var(--text-xs)';
              cardDesc.style.color = 'var(--color-ink-muted)';
              cardDesc.style.marginTop = 'var(--space-1)';
              cardDesc.textContent = act.desc;

              card.appendChild(cardTitle);
              card.appendChild(cardDesc);
              actionGrid.appendChild(card);
            });

            actionSection.appendChild(actionGrid);
            container.appendChild(actionSection);

            // 4. Recent Bookings Table
            const recentSection = document.createElement('section');
            recentSection.style.marginTop = 'var(--space-6)';

            const recentHead = document.createElement('div');
            recentHead.style.display = 'flex';
            recentHead.style.justifyContent = 'space-between';
            recentHead.style.alignItems = 'center';
            recentHead.style.marginBottom = 'var(--space-3)';

            const recentTitle = document.createElement('h2');
            recentTitle.className = 'section-title';
            recentTitle.style.fontSize = 'var(--text-lg)';
            recentTitle.textContent = 'Recent System Bookings';

            const viewAllLink = document.createElement('a');
            viewAllLink.href = 'bookings.html';
            viewAllLink.style.fontSize = 'var(--text-xs)';
            viewAllLink.style.color = 'var(--color-accent)';
            viewAllLink.style.fontWeight = '600';
            viewAllLink.textContent = 'View All Bookings →';

            recentHead.appendChild(recentTitle);
            recentHead.appendChild(viewAllLink);
            recentSection.appendChild(recentHead);

            if (recent.length === 0) {
              const emptyCard = document.createElement('div');
              emptyCard.style.padding = 'var(--space-6)';
              emptyCard.style.background = '#FFFFFF';
              emptyCard.style.border = '1px solid var(--color-border)';
              emptyCard.style.textAlign = 'center';
              emptyCard.style.color = 'var(--color-ink-muted)';
              emptyCard.textContent = 'No reservations have been recorded yet.';
              recentSection.appendChild(emptyCard);
            } else {
              const tableWrapper = document.createElement('div');
              tableWrapper.style.overflowX = 'auto';
              tableWrapper.style.background = '#FFFFFF';
              tableWrapper.style.border = '1px solid var(--color-border)';

              const table = document.createElement('table');
              table.style.width = '100%';
              table.style.borderCollapse = 'collapse';
              table.style.fontSize = 'var(--text-xs)';

              table.innerHTML = `
                <thead>
                  <tr style="border-bottom: 1px solid var(--color-border); text-align: left; background: var(--color-surface);">
                    <th style="padding: 10px 14px;">Booking #</th>
                    <th style="padding: 10px 14px;">Customer</th>
                    <th style="padding: 10px 14px;">Facility</th>
                    <th style="padding: 10px 14px;">Slot</th>
                    <th style="padding: 10px 14px;">Amount</th>
                    <th style="padding: 10px 14px;">Status</th>
                    <th style="padding: 10px 14px;">Created</th>
                  </tr>
                </thead>
                <tbody>
                  ${recent.map(b => `
                    <tr style="border-bottom: 1px solid var(--color-border);">
                      <td style="padding: 10px 14px; font-weight: 600;">${b.bookingNumber || '-'}</td>
                      <td style="padding: 10px 14px;">${b.userId ? b.userId.name : 'Unknown'}</td>
                      <td style="padding: 10px 14px;">${b.locationId ? b.locationId.name : '-'}</td>
                      <td style="padding: 10px 14px; font-weight: 500;">${b.slotId ? b.slotId.slotNumber : '-'}</td>
                      <td style="padding: 10px 14px; font-weight: 600;">৳${b.totalAmount || 0}</td>
                      <td style="padding: 10px 14px;"><span class="badge ${b.bookingStatus === 'CONFIRMED' || b.bookingStatus === 'COMPLETED' ? 'badge-success' : (b.bookingStatus === 'ACTIVE' ? 'badge-info' : 'badge-warning')}">${b.bookingStatus}</span></td>
                      <td style="padding: 10px 14px; color: var(--color-ink-muted);">${new Date(b.createdAt).toLocaleDateString()}</td>
                    </tr>
                  `).join('')}
                </tbody>
              `;
              tableWrapper.appendChild(table);
              recentSection.appendChild(tableWrapper);
            }

            container.appendChild(recentSection);

          } catch (err) {
            console.error('Admin dashboard error:', err);
            container.innerHTML = `<div class="error-notice">Failed to load administrator metrics: ${err.message}</div>`;
          }
        }

        function createStatCard(label, value, subtext = '') {
          const card = document.createElement('div');
          card.className = 'stat-card';

          const lbl = document.createElement('span');
          lbl.className = 'stat-card-label';
          lbl.textContent = label;

          const val = document.createElement('div');
          val.className = 'stat-card-value';
          val.textContent = value;

          card.appendChild(lbl);
          card.appendChild(val);

          if (subtext) {
            const sub = document.createElement('span');
            sub.className = 'stat-card-sub';
            sub.textContent = subtext;
            card.appendChild(sub);
          }

          return card;
        }

        loadDashboard();

      } catch (err) {
        console.error('Admin Init Error:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', initAdminDashboard);
  </script>
</body>
</html>
